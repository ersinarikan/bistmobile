# SonarCloud / SonarQube — bistmobile (Flutter)
# Token: SONAR_TOKEN env (asla commit etme)

sonar.projectKey=ersinarikan_bistmobile
sonar.projectName=bistmobile
sonar.organization=ersinarikan
sonar.host.url=https://sonarcloud.io

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
**/build/**,\
**/.dart_tool/**,\
**/android/**,\
**/ios/**,\
**/assets/**,\
**/*.g.dart,\
**/*.freezed.dart

sonar.test.inclusions=test/**/*.dart

# Flutter coverage → Sonar generic XML (Dart sensor lcov import yok)
sonar.coverageReportPaths=coverage/sonar-generic-coverage.xml
sonar.coverage.exclusions=\
**/main.dart,\
**/*.g.dart,\
**/legal_urls.dart,\
**/features/billing/**,\
**/turnstile_bridge_screen.dart,\
**/auth_screen.dart,\
**/session_controller.dart,\
**/verify_email_pending_screen.dart,\
**/api_client.dart,\
**/deep_link_router.dart,\
**/oauth_sign_in.dart

# Intentional JS channel for Cloudflare Turnstile (§8.6); allowlisted navigation only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=dart:S7409
sonar.issue.ignore.multicriteria.e1.resourceKey=**/turnstile_bridge_screen.dart
sonar.projectVersion=1.0.0+69
